services:
  - type: web
    name: apiscope-demo
    runtime: node
    plan: free
    branch: Dev
    buildCommand: >-
      npm install -g pnpm@11.11.0 &&
      cd frontend && npm install && npm run build &&
      cd ../backend && pnpm install --frozen-lockfile --prod=false
    startCommand: cd backend && pnpm run start
    healthCheckPath: /health
